# Module 2 — Lakeflow Job: claims → bronze → silver → gold (serverless, schema as a job parameter)
resources:
  jobs:
    claims_medallion:
      name: claims-medallion
      schedule:                               # dev mode pauses this automatically
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure: [ "${workspace.current_user.userName}" ]
      parameters:
        - { name: catalog,            default: "${var.catalog}" }
        - { name: schema,             default: "${var.schema}" }
        - { name: claims_table,       default: "${var.claims_table}" }
        - { name: target_schema,      default: "${var.target_schema}" }
        - { name: create_sample_data, default: "${var.create_sample_data}" }
        - { name: run_date,           default: "{{job.start_time.iso_date}}" }
        - { name: simulate_failure,   default: "false" }
      tasks:
        - task_key: setup
          notebook_task: { notebook_path: ../src/00_setup.py }
        - task_key: bronze
          depends_on: [ { task_key: setup } ]
          notebook_task: { notebook_path: ../src/01_bronze.py }
        - task_key: silver
          depends_on: [ { task_key: bronze } ]
          notebook_task: { notebook_path: ../src/02_silver.py }
        - task_key: gold
          depends_on: [ { task_key: silver } ]
          max_retries: 1
          min_retry_interval_millis: 30000
          notebook_task: { notebook_path: ../src/03_gold.py }
