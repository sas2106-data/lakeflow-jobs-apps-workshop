# Claims → Gold → Genie → App workshop
# Set variables once per shell (works in bash and zsh):
#   export BUNDLE_VAR_catalog=main BUNDLE_VAR_schema=<claims schema> BUNDLE_VAR_target_schema=<gold schema> \
#          BUNDLE_VAR_warehouse_id=<id> BUNDLE_VAR_app_name=claims-genie-<you> BUNDLE_VAR_group_name=<group>
# Then:    databricks bundle validate -t dev && databricks bundle deploy -t dev
#          databricks bundle run claims_medallion -t dev   (whole job: setup → bronze → silver → gold)
#          databricks bundle run claims_app -t dev         (deploy + start the Genie app)
bundle:
  name: claims-genie-workshop

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog that holds the claims table
    default: main
  schema:
    description: Schema that holds the claims table — provided at deploy/run time
  claims_table:
    description: Name of the claims table in that schema
    default: claims
  target_schema:
    description: Schema for the bronze / silver / gold tables (Genie reads gold from here)
  create_sample_data:
    description: Create a synthetic claims table if it doesn't exist (dry runs only)
    default: "false"
  warehouse_id:
    description: SQL warehouse for the Genie space and the app
  group_name:
    description: Workspace group that gets access to gold data, the Genie space and the app
    default: workshop-users
  app_name:
    description: App name — unique per attendee (lowercase, digits, hyphens; max 30 chars)
    default: claims-genie

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    # In prod, deploy from CI as a service principal, e.g.:
    # variables:
    #   schema: claims
    #   target_schema: claims_gold
